<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản Khách hàng - UTE Express</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}" href="/css/design-system.css">
    <link rel="stylesheet" th:href="@{/css/components.css}" href="/css/components.css">
    <link rel="stylesheet" th:href="@{/css/layout.css}" href="/css/layout.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
            padding: 30px 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            padding: 36px 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 12px;
        }
        .field-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
            font-weight: 500;
        }
        .form-control.is-invalid {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a th:href="@{/}" href="/" class="auth-logo" style="display: block; text-align: center;">
                    <img th:src="@{/images/logo-ute-express.png}" src="/images/logo-ute-express.png" alt="UTE Express" style="height: 64px; object-fit: contain; margin-bottom: 8px;">
                </a>
                <h1 style="font-size: 24px; font-weight: 700; color: var(--brand-blue);">Tạo tài khoản Khách hàng</h1>
                <p style="color: var(--text-secondary); font-size: 13px; margin-top: 4px;">Đăng ký để gửi hàng nhanh chóng và quản lý đơn hàng trực tuyến</p>
            </div>

            <!-- Alert Box -->
            <div id="alertBox" style="display: none; padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 20px;"></div>

            <!-- Step 1: Điền thông tin & nhận OTP -->
            <form id="step1Form" onsubmit="handleSendOtp(event)" novalidate>
                <div class="form-group">
                    <label class="form-label">Họ và tên <span style="color: red;">*</span></label>
                    <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn An">
                    <div class="field-error" id="fullNameError"></div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Số điện thoại (Tên đăng nhập) <span style="color: red;">*</span></label>
                        <input type="tel" class="form-control" id="phone" placeholder="10 chữ số...">
                        <div class="field-error" id="phoneError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email <span style="color: red;">*</span></label>
                        <input type="email" class="form-control" id="email" placeholder="example@email.com">
                        <div class="field-error" id="emailError"></div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Mật khẩu <span style="color: red;">*</span></label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••">
                        <div class="field-error" id="passwordError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nhập lại mật khẩu <span style="color: red;">*</span></label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••">
                        <div class="field-error" id="confirmPasswordError"></div>
                    </div>
                </div>

                <button type="submit" id="btnSendOtp" class="btn btn-primary btn-block btn-lg" style="margin-top: 16px;">
                    Gửi mã OTP xác thực
                </button>
            </form>

            <!-- Step 2: Nhập OTP -->
            <form id="step2Form" onsubmit="handleVerifyOtp(event)" style="display: none;" novalidate>
                <div style="background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: var(--radius-md); padding: 14px; margin-bottom: 20px; font-size: 13px; color: #1E40AF;">
                    📩 Mã OTP 6 chữ số đã được gửi tới Email của bạn. Vui lòng kiểm tra hộp thư!
                </div>

                <div class="form-group">
                    <label class="form-label">Mã OTP (6 chữ số) <span style="color: red;">*</span></label>
                    <input type="text" class="form-control" id="otpCode" placeholder="123456" maxlength="6" style="font-size: 20px; letter-spacing: 6px; text-align: center;">
                    <div class="field-error" id="otpCodeError" style="text-align: center;"></div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="backToStep1()" style="flex: 1;">Quay lại</button>
                    <button type="submit" id="btnVerify" class="btn btn-primary" style="flex: 2;">Hoàn tất đăng ký</button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-secondary);">
                Đã có tài khoản? <a th:href="@{/login}" href="/login" style="color: var(--primary-blue); font-weight: 600;">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <script>
        let regData = {};

        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('alertBox');
            box.style.display = 'block';
            box.style.backgroundColor = isSuccess ? 'var(--success-bg)' : 'var(--danger-bg)';
            box.style.color = isSuccess ? 'var(--success)' : 'var(--danger)';
            box.innerText = msg;
        }

        function clearAllErrors() {
            document.getElementById('alertBox').style.display = 'none';
            document.querySelectorAll('.field-error').forEach(el => {
                el.innerText = '';
                el.style.display = 'none';
            });
            document.querySelectorAll('.form-control').forEach(el => {
                el.classList.remove('is-invalid');
            });
        }

        function setFieldError(inputId, errorId, message) {
            const input = document.getElementById(inputId);
            const errDiv = document.getElementById(errorId);
            if (input) input.classList.add('is-invalid');
            if (errDiv) {
                errDiv.innerText = message;
                errDiv.style.display = 'block';
            }
        }

        function handleApiError(data) {
            let hasFieldError = false;

            const fieldMap = {
                'hoTen': { inputId: 'fullName', errorId: 'fullNameError' },
                'sdt': { inputId: 'phone', errorId: 'phoneError' },
                'email': { inputId: 'email', errorId: 'emailError' },
                'matKhau': { inputId: 'password', errorId: 'passwordError' },
                'otp': { inputId: 'otpCode', errorId: 'otpCodeError' }
            };

            if (data && data.data && typeof data.data === 'object') {
                for (const [key, msg] of Object.entries(data.data)) {
                    if (fieldMap[key]) {
                        setFieldError(fieldMap[key].inputId, fieldMap[key].errorId, msg);
                        hasFieldError = true;
                    }
                }
            }

            const msg = data ? data.message : 'Có lỗi xảy ra, vui lòng thử lại';

            if (msg && msg.toLowerCase().includes('số điện thoại')) {
                setFieldError('phone', 'phoneError', msg);
                hasFieldError = true;
            } else if (msg && msg.toLowerCase().includes('email')) {
                setFieldError('email', 'emailError', msg);
                hasFieldError = true;
            } else if (msg && (msg.toLowerCase().includes('otp') || msg.toLowerCase().includes('mã xác thực'))) {
                setFieldError('otpCode', 'otpCodeError', msg);
                hasFieldError = true;
            }

            if (hasFieldError && msg === 'Dữ liệu đầu vào không hợp lệ') {
                showAlert('Vui lòng kiểm tra và sửa các thông tin chưa hợp lệ bên dưới.');
            } else {
                showAlert(msg || 'Lỗi thao tác!');
            }
        }

        function backToStep1() {
            clearAllErrors();
            document.getElementById('step1Form').style.display = 'block';
            document.getElementById('step2Form').style.display = 'none';
        }

        // Tự động xóa báo lỗi khi người dùng gõ lại vào ô input
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', function() {
                this.classList.remove('is-invalid');
                const formGroup = this.closest('.form-group');
                if (formGroup) {
                    const errDiv = formGroup.querySelector('.field-error');
                    if (errDiv) {
                        errDiv.innerText = '';
                        errDiv.style.display = 'none';
                    }
                }
            });
        });

        async function handleSendOtp(e) {
            e.preventDefault();
            clearAllErrors();

            const hoTen = document.getElementById('fullName').value.trim();
            const sdt = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const matKhau = document.getElementById('password').value.trim();
            const cpw = document.getElementById('confirmPassword').value.trim();

            let isValid = true;

            if (!hoTen) {
                setFieldError('fullName', 'fullNameError', 'Vui lòng nhập họ và tên');
                isValid = false;
            }

            if (!sdt) {
                setFieldError('phone', 'phoneError', 'Vui lòng nhập số điện thoại');
                isValid = false;
            } else if (!/^[0-9]{10}$/.test(sdt)) {
                setFieldError('phone', 'phoneError', 'Số điện thoại phải bao gồm đúng 10 chữ số');
                isValid = false;
            }

            if (!email) {
                setFieldError('email', 'emailError', 'Vui lòng nhập email');
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setFieldError('email', 'emailError', 'Địa chỉ email không hợp lệ');
                isValid = false;
            }

            if (!matKhau) {
                setFieldError('password', 'passwordError', 'Vui lòng nhập mật khẩu');
                isValid = false;
            } else if (matKhau.length < 6) {
                setFieldError('password', 'passwordError', 'Mật khẩu phải có ít nhất 6 ký tự');
                isValid = false;
            }

            if (!cpw) {
                setFieldError('confirmPassword', 'confirmPasswordError', 'Vui lòng nhập lại mật khẩu');
                isValid = false;
            } else if (matKhau !== cpw) {
                setFieldError('confirmPassword', 'confirmPasswordError', 'Mật khẩu nhập lại không trùng khớp');
                isValid = false;
            }

            if (!isValid) {
                showAlert('Vui lòng kiểm tra lại thông tin nhập trong các ô bên dưới.');
                return;
            }

            regData = { hoTen, sdt, email, matKhau };
            const btn = document.getElementById('btnSendOtp');
            btn.disabled = true;
            btn.innerText = 'Đang gửi OTP...';

            try {
                const res = await fetch('/api/auth/register/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hoTen, sdt, email })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert('Gửi mã OTP thành công!', true);
                    document.getElementById('step1Form').style.display = 'none';
                    document.getElementById('step2Form').style.display = 'block';
                } else {
                    handleApiError(data);
                }
            } catch (err) {
                showAlert('Lỗi kết nối máy chủ!');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Gửi mã OTP xác thực';
            }
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();
            clearAllErrors();

            const otp = document.getElementById('otpCode').value.trim();
            let isValid = true;

            if (!otp) {
                setFieldError('otpCode', 'otpCodeError', 'Vui lòng nhập mã OTP');
                isValid = false;
            } else if (!/^[0-9]{6}$/.test(otp)) {
                setFieldError('otpCode', 'otpCodeError', 'Mã OTP phải gồm 6 chữ số');
                isValid = false;
            }

            if (!isValid) return;

            const btn = document.getElementById('btnVerify');
            btn.disabled = true;
            btn.innerText = 'Đang xác thực...';

            try {
                const res = await fetch('/api/auth/register/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sdt: regData.sdt,
                        otp: otp,
                        hoTen: regData.hoTen,
                        matKhau: regData.matKhau,
                        email: regData.email
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showAlert('Đăng ký tài khoản thành công! Đang chuyển hướng...', true);
                    setTimeout(() => { window.location.href = '/login'; }, 1000);
                } else {
                    handleApiError(data);
                }
            } catch (err) {
                showAlert('Lỗi kết nối máy chủ!');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Hoàn tất đăng ký';
            }
        }
    </script>
</body>
</html>
