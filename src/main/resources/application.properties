spring.application.name=uteexpress
server.port=8080

# =============================================
# DATABASE - PostgreSQL
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ute_express
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================
# JWT
# =============================================
app.jwt.secret=UTEExpressSecretKey2024_This_Must_Be_At_Least_256_Bits_Long_For_HS256
app.jwt.expiration-ms=86400000

# =============================================
# EMAIL (Gmail SMTP) - Dien App Password vao day
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lephongle475@gmail.com
spring.mail.password=jkypspeuryjggroq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OTP expiry (minutes)
app.otp.expiry-minutes=5

# =============================================
# SPRINGDOC / SWAGGER UI
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# =============================================
# LOGGING
# =============================================
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.security=INFO
